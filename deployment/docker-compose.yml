services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onebridge
      POSTGRES_USER: onebridge
      POSTGRES_PASSWORD: onebridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onebridge -d onebridge"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: onebridge
      MINIO_ROOT_PASSWORD: onebridge-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment: &onebridge_env
      ONEBRIDGE_DATABASE_URL: postgresql+psycopg://onebridge:onebridge@postgres:5432/onebridge
      ONEBRIDGE_TASK_QUEUE_URL: postgresql://onebridge:onebridge@postgres:5432/onebridge
      ONEBRIDGE_STATE_ROOT: /var/lib/onebridge
      ONEBRIDGE_STORAGE_ROOT: /var/lib/onebridge/objects
      ONEBRIDGE_CHECKPOINT_ROOT: /var/lib/onebridge/checkpoints
      ONEBRIDGE_AUDIT_LOG: /var/lib/onebridge/audit.jsonl
      ONEBRIDGE_IDENTITY_DB: /var/lib/onebridge/identity.db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - onebridge_state:/var/lib/onebridge
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["onebridge", "worker", "--poll", "1.0"]
    environment: *onebridge_env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - onebridge_state:/var/lib/onebridge
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  onebridge_state:
