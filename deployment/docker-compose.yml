services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onebridge
      POSTGRES_USER: onebridge
      POSTGRES_PASSWORD: onebridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: onebridge
      MINIO_ROOT_PASSWORD: onebridge-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
